name: CI

# Runs when a version tag such as v0.1.0 is pushed. The tests run first on Linux, Windows and macOS;
# only when every test passes are the desktop apps built and released, and the web site built and
# deployed to GitHub Pages.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Inkitty.slnx -c Release

      - name: Test
        run: dotnet test --solution Inkitty.slnx -c Release --no-build

  web:
    needs: test
    uses: ./.github/workflows/web.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  desktop:
    needs: test
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
