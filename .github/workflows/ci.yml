name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Inkitty.slnx -c Release

      - name: Test
        run: dotnet test --solution Inkitty.slnx -c Release --no-build

      - name: Publish smoke test
        run: dotnet publish src/Inkitty.App/Inkitty.App.csproj -c Release -r ${{ matrix.rid }} --self-contained -o artifacts/${{ matrix.rid }}
