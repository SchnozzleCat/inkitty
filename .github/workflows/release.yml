name: Desktop builds

# Called by ci.yml once the tests pass: builds the desktop app for every platform and publishes the
# builds as a GitHub release for the tag.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # One self-contained executable: no .NET install needed to run it. The tag (v0.1.0) is the
      # version shown in the app (0.1.0).
      - name: Publish
        shell: bash
        run: >
          dotnet publish src/Inkitty.Desktop/Inkitty.Desktop.csproj
          -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:Version=${GITHUB_REF_NAME#v}
          -o publish

      # Linux and Windows ship the bare executable, renamed per platform so the release assets
      # don't clash.
      - name: Package (Linux)
        if: startsWith(matrix.rid, 'linux')
        run: |
          mkdir -p dist
          cp publish/Inkitty dist/inkitty-${{ matrix.rid }}

      - name: Package (Windows)
        if: startsWith(matrix.rid, 'win')
        shell: bash
        run: |
          mkdir -p dist
          cp publish/Inkitty.exe dist/inkitty-${{ matrix.rid }}.exe

      # An unsigned Inkitty.app (see the README for opening it the first time).
      - name: Package (macOS)
        if: startsWith(matrix.rid, 'osx')
        run: |
          app=dmg/Inkitty.app
          mkdir -p "$app/Contents/MacOS" dist
          cp publish/Inkitty "$app/Contents/MacOS/"
          cp src/Inkitty.Desktop/Info.plist "$app/Contents/"
          mkdir -p "$app/Contents/Resources"
          cp src/Inkitty.Desktop/Assets/Icons/inkitty.icns "$app/Contents/Resources/"
          codesign --force --deep --sign - "$app"   # ad-hoc: required to run on Apple silicon
          ln -s /Applications dmg/Applications     # drag-to-install target in the dmg window
          # hdiutil's own size estimate for -srcfolder is often too small on the APFS runners
          # ("No space left on device"), so size the image explicitly with some headroom.
          size_mb=$(( $(du -sm dmg | cut -f1) + 50 ))
          hdiutil create -volname Inkitty -srcfolder dmg -fs HFS+ -size ${size_mb}m \
            -format UDZO dist/inkitty-${{ matrix.rid }}.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: inkitty-${{ matrix.rid }}
          path: dist/inkitty-${{ matrix.rid }}*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: inkitty-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/*
          --repo "${{ github.repository }}" --title "Inkitty ${{ github.ref_name }}"
          --generate-notes --prerelease
