name: Web

# Called by ci.yml once the tests pass: builds the site and deploys it to GitHub Pages.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Onigwrap (TextMate regexes) is linked into the wasm runtime, which needs Emscripten.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      # The tag (v0.1.0) is the version shown in the app (0.1.0).
      - name: Publish
        run: scripts/publish-web.sh "-p:Version=${GITHUB_REF_NAME#v}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
